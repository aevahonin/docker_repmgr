# Аутентификация: только scram-sha-256, доступ ограничен docker-подсетью.
# DOCKER_SUBNET подставляется entrypoint'ом (envsubst); по умолчанию — приватные диапазоны Docker.
local   all             postgres                                peer
local   all             all                                     scram-sha-256

host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# Репликация и repmgr — только из docker-подсети
host    replication     ${REPMGR_USER}  ${DOCKER_SUBNET}        scram-sha-256
host    ${POSTGRES_DB}  ${REPMGR_USER}  ${DOCKER_SUBNET}        scram-sha-256
host    all             all             ${DOCKER_SUBNET}        scram-sha-256